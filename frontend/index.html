<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASE - Sistema de Automatização do Sinal Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body">
        <h1>Bem-vindo ao SASE</h1>
        <p>Cadastro de horários</p>
        <form action="/envio" method="post">
            <input type="time" name="time" id="time">
            <input type="submit" value="Adicionar">
        </form>
        <br>
        <br>
        <p>O SASE surjiu para atender uma necessiadade no controle dos horários escolares.</p>
    </div>
</body>
