<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SASE - Login</title>

    <link rel="stylesheet" href="/style/login.css">
</head>

<body>
    <main class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo">
                <div class="bell">
                    <img
                        src="/assets/SASE ICON.png"
                        width="200"
                    />
                </div>
            </div>

            <!-- Formulário -->
            <form class="login-form" method="post" action="/envio">
                <div class="input-group">
                    <label for="Email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu Email:"
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="password"
                        placeholder="Digite sua Senha:"
                        minlength="6"
                    >
                </div>

                <a href="/signUp" class="forgot-sign-up">
                    Ainda não tenho uma conta
                </a>

                <button type="submit">
                    Entrar
                </button>

                <a href="#" class="forgot-password">
                    Esqueceu sua senha?
                </a>
            </form>
        </div>
    </main>
</body>
</html>
